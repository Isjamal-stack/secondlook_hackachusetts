<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
</head>
<body>
    <h1>Icon Generator</h1>
    <p>This will generate placeholder icons for the PWA.</p>
    <button onclick="generateIcons()">Generate Icons</button>
    
    <script>
        function generateIcons() {
            const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
            
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                // Background
                ctx.fillStyle = '#1976d2';
                ctx.fillRect(0, 0, size, size);
                
                // Car icon (simplified)
                ctx.fillStyle = '#ffffff';
                const scale = size / 24;
                ctx.save();
                ctx.scale(scale, scale);
                
                // Draw simplified car
                ctx.beginPath();
                ctx.moveTo(18.92, 6.01);
                ctx.lineTo(17.5, 5);
                ctx.lineTo(6.5, 5);
                ctx.lineTo(5.08, 6.01);
                ctx.lineTo(3, 12);
                ctx.lineTo(3, 20);
                ctx.lineTo(5, 20);
                ctx.lineTo(5, 19);
                ctx.lineTo(19, 19);
                ctx.lineTo(19, 20);
                ctx.lineTo(21, 20);
                ctx.lineTo(21, 12);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
                
                // Download
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon-${size}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                });
            });
            
            alert('Icons generated! Check your downloads folder.');
        }
    </script>
</body>
</html>
